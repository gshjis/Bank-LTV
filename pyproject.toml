[project]
name = "kaggle-ltv"
version = "0.1.0"
description = ""
authors = [
    {name = "gshjis",email = "ilya.togan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "catboost (>=1.2.10,<2.0.0)",
    "mlflow (>=2.20.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.18.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=8.3.0,<9.0.0)",
    "pyright (>=1.1.390,<2.0.0)"
]
